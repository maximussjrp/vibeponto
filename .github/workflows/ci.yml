name: CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend hardening tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hardening_r2
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hardening_r2"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:55432/hardening_r2
      REDIS_URL: redis://localhost:56379/0
      CELERY_BROKER_URL: redis://localhost:56379/1
      CELERY_RESULT_BACKEND: redis://localhost:56379/2
      SECRET_KEY: ci-secret-key-with-enough-entropy-0123456789abcdef
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-0123456789abcdef
      ENVIRONMENT: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run hardening tests
        run: python -m pytest tests/test_hardening_*.py -q

      - name: Verify Alembic head from empty schema
        run: |
          python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.begin() as conn:
                  await conn.execute(text("DROP SCHEMA public CASCADE"))
                  await conn.execute(text("CREATE SCHEMA public"))
                  await conn.execute(text("CREATE EXTENSION IF NOT EXISTS postgis"))
              await engine.dispose()

          asyncio.run(main())
          PY
          alembic upgrade head
          alembic current

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

      - name: Build Next.js
        run: npm run build

  docker:
    name: Docker compose and production images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate development compose
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config >/dev/null

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example build api frontend
