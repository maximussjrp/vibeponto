services:
  # ============================================================================
  # POSTGRESQL DESCARTÁVEL DE STAGING (E2E-05, STG.1-PLAN-03)
  # ============================================================================
  staging-postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: vibeponto-staging-postgres
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging_postgres_password}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-test_vibeponto_staging}
    ports:
      - "127.0.0.1:54399:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER:-postgres} -d ${STAGING_POSTGRES_DB:-test_vibeponto_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # ============================================================================
  # REDIS DESCARTÁVEL DE STAGING (E2E-05, STG.1-PLAN-03)
  # ============================================================================
  staging-redis:
    image: redis:7-alpine
    container_name: vibeponto-staging-redis
    command: redis-server --requirepass ${STAGING_REDIS_PASSWORD:-staging_redis_password}
    environment:
      REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:-staging_redis_password}
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # ============================================================================
  # MINIO DESCARTÁVEL DE STAGING (E2E-05, STG.1-PLAN-03)
  # ============================================================================
  staging-minio:
    image: elestio/minio:latest
    container_name: vibeponto-staging-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STAGING_MINIO_USER:-stagingstorage}
      MINIO_ROOT_PASSWORD: ${STAGING_MINIO_PASSWORD:-staging_minio_password}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - staging-network

  # ============================================================================
  # RABBITMQ DESCARTÁVEL DE STAGING (E2E-05, STG.1-PLAN-03)
  # ============================================================================
  staging-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vibeponto-staging-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${STAGING_RABBITMQ_USER:-stagingmq}
      RABBITMQ_DEFAULT_PASS: ${STAGING_RABBITMQ_PASSWORD:-staging_rabbitmq_password}
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - staging-network

  # ============================================================================
  # BACKEND API STAGING (E2E-05, STG.1-PLAN-03 - ENVIRONMENT=staging)
  # ============================================================================
  staging-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: vibeponto-staging-api
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      ALLOW_DESTRUCTIVE_TESTING: "false"
      DATABASE_URL: postgresql+asyncpg://${STAGING_POSTGRES_USER:-postgres}:${STAGING_POSTGRES_PASSWORD:-staging_postgres_password}@staging-postgres:5432/${STAGING_POSTGRES_DB:-test_vibeponto_staging}
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
      SECRET_KEY: ${STAGING_SECRET_KEY:-staging_secret_key_for_e2e_testing_min64chars_1234567890abcdef}
      MFA_ENCRYPTION_KEY: ${STAGING_MFA_ENCRYPTION_KEY:-staging_mfa_encryption_key_32chars_123456}
      STORAGE_ENDPOINT: http://staging-minio:9000
      STORAGE_ACCESS_KEY: ${STAGING_MINIO_USER:-stagingstorage}
      STORAGE_SECRET_KEY: ${STAGING_MINIO_PASSWORD:-staging_minio_password}
      STORAGE_BUCKET: test-vibeponto-staging
      CELERY_BROKER_URL: amqp://${STAGING_RABBITMQ_USER:-stagingmq}:${STAGING_RABBITMQ_PASSWORD:-staging_rabbitmq_password}@staging-rabbitmq:5672//
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      staging-postgres:
        condition: service_healthy
      staging-redis:
        condition: service_healthy
      staging-minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - staging-network

networks:
  staging-network:
    driver: bridge
