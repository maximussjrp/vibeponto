services:
  # ============================================================================
  # POSTGRESQL + POSTGIS + TIMESCALEDB
  # ============================================================================
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: vibeponto-postgres
    environment:
      POSTGRES_USER: vibeponto
      POSTGRES_PASSWORD: vibeponto_dev_123
      POSTGRES_DB: vibeponto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeponto -d vibeponto"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibeponto-network

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: vibeponto-redis
    command: redis-server --appendonly yes --requirepass redis_dev_123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibeponto-network

  # ============================================================================
  # MINIO (S3-Compatible Storage)
  # ============================================================================
  minio:
    image: elestio/minio:latest
    container_name: vibeponto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vibeponto-network

  # ============================================================================
  # RABBITMQ (Message Queue)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vibeponto-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: vibeponto
      RABBITMQ_DEFAULT_PASS: rabbitmq_dev_123
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - vibeponto-network

  # ============================================================================
  # BACKEND API
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: vibeponto-api
    environment:
      DATABASE_URL: postgresql+asyncpg://vibeponto:vibeponto_dev_123@postgres:5432/vibeponto
      REDIS_URL: redis://:redis_dev_123@redis:6379/0
      JWT_SECRET_KEY: dev_secret_key_change_in_production_123456789
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin123
      STORAGE_BUCKET: vibeponto
      CELERY_BROKER_URL: amqp://vibeponto:rabbitmq_dev_123@rabbitmq:5672//
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - vibeponto-network

  # ============================================================================
  # FRONTEND WEB (Next.js)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: vibeponto-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev
    networks:
      - vibeponto-network

  # ============================================================================
  # CELERY WORKER (Background Tasks)
  # ============================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: vibeponto-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://vibeponto:vibeponto_dev_123@postgres:5432/vibeponto
      REDIS_URL: redis://:redis_dev_123@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin123
      CELERY_BROKER_URL: amqp://vibeponto:rabbitmq_dev_123@rabbitmq:5672//
    volumes:
      - ./backend:/app
    depends_on:
      - api
      - rabbitmq
    command: celery -A app.worker worker --loglevel=info
    networks:
      - vibeponto-network

  # ============================================================================
  # CELERY BEAT (Scheduled Tasks)
  # ============================================================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: vibeponto-celery-beat
    environment:
      DATABASE_URL: postgresql+asyncpg://vibeponto:vibeponto_dev_123@postgres:5432/vibeponto
      REDIS_URL: redis://:redis_dev_123@redis:6379/0
      CELERY_BROKER_URL: amqp://vibeponto:rabbitmq_dev_123@rabbitmq:5672//
    volumes:
      - ./backend:/app
    depends_on:
      - celery-worker
    command: celery -A app.worker beat --loglevel=info
    networks:
      - vibeponto-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:

networks:
  vibeponto-network:
    driver: bridge
